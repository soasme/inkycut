services:
  postgres:
    image: postgres:16-alpine
    container_name: inkycut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inkycut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inkycut"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
